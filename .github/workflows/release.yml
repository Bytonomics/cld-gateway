# Release workflow for cld-gateway.
# To release, push a tag matching the format:
# ```
# git tag -a cld-gateway-v0.1.0 -m "Release 0.1.0"
# git push origin cld-gateway-v0.1.0
# ```

name: release

on:
  push:
    tags:
      - "cld-gateway-v*.*.*"
      - "cld-gateway-v*.*.*-alpha*"
      - "cld-gateway-v*.*.*-beta*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate tag format and version match
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Tag validation"

          # 1. Must be a tag and match the expected format.
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] \
            || { echo "Not a tag push"; exit 1; }
          [[ "${GITHUB_REF_NAME}" =~ ^cld-gateway-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$ ]] \
            || { echo "Tag '${GITHUB_REF_NAME}' does not match expected format cld-gateway-v<MAJOR>.<MINOR>.<PATCH>[-alpha[.N]|-beta[.N]]"; exit 1; }

          # 2. Extract versions.
          tag_ver="${GITHUB_REF_NAME#cld-gateway-v}"
          cargo_ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "([^"]+)".*/\1/')"

          # 3. Compare.
          [[ "${tag_ver}" == "${cargo_ver}" ]] \
            || { echo "Tag version ${tag_ver} does not match Cargo.toml version ${cargo_ver}"; exit 1; }

          echo "Tag and Cargo.toml agree on version ${tag_ver}"
          echo "::endgroup::"

  build:
    needs: tag-check
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "scripts/release/pyproject.toml"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig (musl targets)
        if: ${{ contains(matrix.target, 'linux-musl') }}
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.14.0

      - name: Install cargo-zigbuild (musl targets)
        if: ${{ contains(matrix.target, 'linux-musl') }}
        shell: bash
        run: cargo install cargo-zigbuild --locked

      - name: Build binary (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          cargo build --locked --release --target ${{ matrix.target }} -p gatewayd --bin cld-gateway

      - name: Build binary (Linux musl)
        if: ${{ contains(matrix.target, 'linux-musl') }}
        shell: bash
        run: |
          cargo zigbuild --locked --release --target ${{ matrix.target }} -p gatewayd --bin cld-gateway

      - name: Package archive
        shell: bash
        run: |
          mkdir -p dist
          bash .github/scripts/build-cld-gateway-package-archive.sh \
            --target ${{ matrix.target }} \
            --entrypoint-bin target/${{ matrix.target }}/release/cld-gateway \
            --archive-output dist/cld-gateway-package-${{ matrix.target }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/cld-gateway-package-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist/

      - name: Verify all package archives
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            archive="dist/cld-gateway-package-${target}.tar.gz"
            listing="dist/cld-gateway-package-${target}.contents"
            echo "Verifying ${archive}"
            test -f "${archive}" || { echo "Missing: ${archive}"; exit 1; }
            tar -tzf "${archive}" > "${listing}"
            grep -q "^bin/cld-gateway$" "${listing}" || { echo "Missing bin/cld-gateway in ${archive}"; exit 1; }
            grep -q "^cld-gateway-package.json$" "${listing}" || { echo "Missing cld-gateway-package.json in ${archive}"; exit 1; }
            grep -q "^config.json$" "${listing}" || { echo "Missing config.json in ${archive}"; exit 1; }
            grep -q "^settings.json$" "${listing}" || { echo "Missing settings.json in ${archive}"; exit 1; }
            echo "OK: ${archive}"
          done

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist/

      - name: Copy install scripts
        shell: bash
        run: |
          cp scripts/install/install.sh dist/

      - name: Generate checksum manifest
        shell: bash
        run: |
          cd dist
          sha256sum cld-gateway-package-*.tar.gz > cld-gateway-package_SHA256SUMS
          cat cld-gateway-package_SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cld-gateway-package-*.tar.gz
            dist/cld-gateway-package_SHA256SUMS
            dist/install.sh
          generate_release_notes: true

      - name: Extract release version
        id: release_version
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#cld-gateway-v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$ ]] \
            || { echo "Unsupported release version: ${version}"; exit 1; }
          printf 'value=%s\n' "${version}" >> "$GITHUB_OUTPUT"

      - name: Require tap dispatch token
        env:
          HOMEBREW_TAP_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HOMEBREW_TAP_DISPATCH_TOKEN}" ]] \
            || { echo "Missing HOMEBREW_TAP_DISPATCH_TOKEN secret"; exit 1; }

      - name: Dispatch Homebrew tap update
        env:
          HOMEBREW_TAP_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          repository: Bytonomics/homebrew-tap
          event-type: version-updated
          client-payload: '{"version":"${{ steps.release_version.outputs.value }}"}'
