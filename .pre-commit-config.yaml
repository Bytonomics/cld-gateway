fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        # The docsmith-generated MkDocs config legitimately uses
        # MkDocs-Material's `!!python/name:...` tag (mermaid superfences),
        # which check-yaml's safe loader has no constructor for. It is
        # excluded here and validated instead by the `check-mkdocs-yaml`
        # local hook below, which safe-loads it while whitelisting only
        # that one known tag.
        exclude: ^\.docsmith/.*mkdocs\.ya?ml$
      - id: check-toml

  - repo: local
    hooks:
      - id: check-mkdocs-yaml
        name: check mkdocs yaml (safe loader + whitelisted python/name tag)
        entry: uv run .docsmith/engine/check_mkdocs_yaml.py
        language: system
        files: ^\.docsmith/.*mkdocs\.ya?ml$
      - id: docsmith-validate
        name: docsmith validate
        entry: uv run .docsmith/engine/docsmith.py validate
        language: system
        types: [markdown]
        pass_filenames: false
      - id: docsmith-collect-render
        name: docsmith collect render
        entry: bash -c 'uv run .docsmith/engine/docsmith.py collect render && git diff --quiet .docsmith/site/mkdocs.yml || git add .docsmith/site/mkdocs.yml'
        language: system
        types: [markdown]
        pass_filenames: false
      - id: make-check
        name: make check
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
