fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: docsmith-validate
        name: docsmith validate
        entry: uv run .docsmith/engine/docsmith.py validate
        language: system
        types: [markdown]
        pass_filenames: false
      - id: docsmith-collect-render
        name: docsmith collect render
        entry: bash -c 'uv run .docsmith/engine/docsmith.py collect render && git diff --quiet .docsmith/site/mkdocs.yml || git add .docsmith/site/mkdocs.yml'
        language: system
        types: [markdown]
        pass_filenames: false
      - id: make-check
        name: make check
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
